---
# Wdrożenie simplemadeblinds.mx na cPanel (konto myciu, nethero.pl).
#
# simplemadeblinds.mx jest domeną DODATKOWĄ — jej document root to
# public_html/simplemadeblinds.mx, a nie samo public_html.
#
# cPanel przy deployu TYLKO KOPIUJE, nigdy nie usuwa. Dlatego katalogi, które
# w całości pochodzą z builda, kasujemy przed skopiowaniem — inaczej zostają
# w nich pliki wyrzucone z repo. Najbardziej dotyczy to assets/, gdzie nazwy
# mają hash treści: bez czyszczenia narastałyby tam stare index-*.js z każdego
# wdrożenia.
#
# Pliki luzem w korzeniu (index.html, products.html, 404.html, .htaccess,
# robots.txt, sitemap.xml, favicon.png, logo-email.png, opengraph.jpg) są
# nadpisywane przez cp. Gdyby któryś zniknął z repo, trzeba go skasować na
# serwerze ręcznie. .well-known/ (AutoSSL) nie jest ruszane.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/simplemadeblinds.mx
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/assets $DEPLOYPATH/gallery $DEPLOYPATH/docs $DEPLOYPATH/api
    - /bin/cp -R site/. $DEPLOYPATH/
